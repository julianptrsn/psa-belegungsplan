# Veröffentlicht das Dashboard bei jedem Push auf main über GitHub Pages.
# Kann unter "Actions" → "Dashboard veröffentlichen" → "Run workflow" auch von Hand gestartet werden.
name: Dashboard veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen und Versionsnummer setzen
        run: |
          V="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icons _site/
          sed -i "s/const APP_VERSION='__BUILD__'/const APP_VERSION='$V'/" _site/index.html
          grep -q "APP_VERSION='$V'" _site/index.html
          echo "{\"v\":\"$V\"}" > _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
